<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sangar Family Tree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{
  --paper:#eef2f3; --ink:#1d2b2f; --muted:#5d7176; --line:#4f7f86;
  --card:#ffffff; --edge:#c5d3d6; --accent:#2f6f78; --ring:#9cc3c8;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#121a1c;--ink:#e6eef0;--muted:#93a8ad;--line:#6aa3ab;--card:#1b272a;--edge:#2e4247;--accent:#7cc0c9;--ring:#3d6a71}
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:linear-gradient(135deg, #0f0f1e 0%, #1a1a2e 100%);color:var(--ink);font-family:"Spectral",Georgia,serif;display:flex;flex-direction:column;position:relative}
header{position:fixed;bottom:20px;right:20px;z-index:1000;display:flex;flex-direction:column;align-items:flex-end;gap:1.5rem}
header h1{margin:0;font-size:1.8rem;font-weight:700;letter-spacing:1px;color:#ffffff;text-shadow:0 2px 10px rgba(0,0,0,0.5);background:rgba(255,107,157,0.15);backdrop-filter:blur(10px);padding:1rem 1.5rem;border-radius:15px;border:2px solid rgba(255,107,157,0.3)}
.tools{display:flex;gap:1rem;align-items:center;background:rgba(20,20,35,0.8);backdrop-filter:blur(10px);padding:1rem 1.5rem;border-radius:50px;box-shadow:0 8px 32px rgba(0,0,0,0.5);border:1px solid rgba(255,107,157,0.3)}
.tools button{font:inherit;font-size:1.2rem;width:2.4rem;height:2.4rem;border:2px solid #FF6B9D;background:linear-gradient(135deg, #FF6B9D 0%, #FF8BA8 100%);color:white;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.3s ease;position:relative;font-weight:bold}
.tools button:hover{transform:scale(1.25);box-shadow:0 6px 20px rgba(255, 107, 157, 0.4);border-color:white}
.tools button:active{transform:scale(0.9)}
.tools button:focus-visible{outline:none}
.zoom-display{font-size:0.85rem;color:#ffffff;min-width:40px;text-align:center;padding:0.5rem 1rem;background:rgba(255,107,157,0.2);border-radius:20px;border:1px solid rgba(255,107,157,0.5);font-weight:600}
#viewport{flex:1;overflow:hidden;padding:2rem 2rem 120px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg, #0f0f1e 0%, #1a1a2e 100%);min-height:100vh;scroll-behavior:smooth}
#viewport::-webkit-scrollbar{display:none}
#viewport{-ms-overflow-style:none;scrollbar-width:none}
#stage{position:relative;transform-origin:center center;display:inline-block;transition:transform 0.2s ease;background:transparent;border-radius:0px;padding:0;box-shadow:none;border:none}
svg#lines{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
svg#lines path{fill:none;stroke:#667eea;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;opacity:0.5}
svg#lines .marriage{stroke-width:5;stroke:#FF6B9D;opacity:1}
.card{position:absolute;display:flex;flex-direction:column;align-items:center;text-align:center;padding:1rem 0.8rem;background:linear-gradient(135deg, #2d2d44 0%, #3a3a52 100%);border:2.5px solid #FF6B9D;border-radius:18px;box-shadow:0 6px 20px rgba(255, 107, 157, 0.3);transition:all 0.3s ease}
.card:hover{transform:translateY(-8px);box-shadow:0 12px 35px rgba(255, 107, 157, 0.4);border-color:#FF8BA8}
.card .photo{width:80px;height:80px;border-radius:50%;object-fit:cover;border:4px solid #FF6B9D;background:var(--paper);box-shadow:0 4px 12px rgba(255, 107, 157, 0.3)}
.card .initials{display:flex;align-items:center;justify-content:center;font-size:1.6rem;color:white;width:80px;height:80px;border-radius:50%;border:4px solid #FF6B9D;background:linear-gradient(135deg, #FF6B9D 0%, #FF8BA8 100%);box-shadow:0 4px 12px rgba(255, 107, 157, 0.4);font-weight:bold}
.card .name{margin-top:0.7rem;font-weight:700;font-size:0.95rem;line-height:1.3;color:#ffffff}
.card .years{margin-top:0.3rem;font-size:0.8rem;color:#FF6B9D;font-style:italic;font-weight:500}
#empty{padding:2rem;color:var(--muted);text-align:center;font-size:1.1rem}
.couple-highlight{border:3px solid #FF6B9D !important;box-shadow:0 0 20px rgba(255, 107, 157, 0.5) !important}

@media (max-width: 768px) {
  header {
    display: none !important;
  }
  #viewport {
    padding: 0 !important;
    touch-action: none;
  }
  #stage {
    padding: 0 !important;
  }
}

#viewport {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
}
</style>
</head>
<body>
<header>
  <h1 id="title">🌳 Sangar Family</h1>
  <div class="tools">
    <button id="zout" title="Zoom out" onclick="zoomOut()"><i class="fas fa-minus"></i></button>
    <span class="zoom-display" id="zoomLevel">100%</span>
    <button id="zin" title="Zoom in" onclick="zoomIn()"><i class="fas fa-plus"></i></button>
    <button id="zfit" title="Fit to view" onclick="fitToView()"><i class="fas fa-expand"></i></button>
    <button id="download" title="Download as image" onclick="downloadTree()"><i class="fas fa-download"></i></button>
    <button id="fullscreen" title="Fullscreen" onclick="toggleFullscreen()"><i class="fas fa-maximize"></i></button>
  </div>
</header>
<main id="viewport"><div id="stage"><svg id="lines"></svg></div></main>
<script src="family-data.js"></script>
<script src="app.js"></script>
<script>
  let currentZoom = 1;
  const MIN_ZOOM = 0.3;
  const MAX_ZOOM = 3;
  const ZOOM_STEP = 0.15;

  function updateZoomDisplay() {
    document.getElementById('zoomLevel').textContent = Math.round(currentZoom * 100) + '%';
  }

  function getStage() {
    return document.getElementById('stage');
  }

  function applyZoom() {
    const stage = getStage();
    stage.style.transform = `scale(${currentZoom})`;
    updateZoomDisplay();
  }

  function zoomIn() {
    currentZoom = Math.min(MAX_ZOOM, currentZoom + ZOOM_STEP);
    applyZoom();
  }

  function zoomOut() {
    currentZoom = Math.max(MIN_ZOOM, currentZoom - ZOOM_STEP);
    applyZoom();
  }

  function fitToView() {
    const viewport = document.getElementById('viewport');
    const stage = getStage();
    
    // Get actual stage dimensions
    const stageWidth = stage.offsetWidth;
    const stageHeight = stage.offsetHeight;
    
    if (stageWidth === 0 || stageHeight === 0) return;
    
    const viewportWidth = viewport.clientWidth - 40;
    const viewportHeight = viewport.clientHeight - 40;
    
    const zoomX = viewportWidth / stageWidth;
    const zoomY = viewportHeight / stageHeight;
    
    currentZoom = Math.min(zoomX, zoomY, 1);
    applyZoom();
  }

  function downloadTree() {
    const svg = document.getElementById('lines');
    const stage = getStage();
    
    const width = parseInt(svg.getAttribute('width')) || 1200;
    const height = parseInt(svg.getAttribute('height')) || 800;
    
    // Create canvas
    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext('2d');
    
    // Fill white background
    ctx.fillStyle = 'white';
    ctx.fillRect(0, 0, width, height);
    
    // Draw all cards
    const cards = document.querySelectorAll('.card');
    cards.forEach(card => {
      const style = card.getAttribute('style');
      const leftMatch = style.match(/left:(\d+(?:\.\d+)?)px/);
      const topMatch = style.match(/top:(\d+(?:\.\d+)?)px/);
      
      if (leftMatch && topMatch) {
        const x = parseFloat(leftMatch[1]);
        const y = parseFloat(topMatch[1]);
        const w = card.offsetWidth;
        const h = card.offsetHeight;
        
        // Draw card background
        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = '#c5d3d6';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, 10);
        ctx.fill();
        ctx.stroke();
        
        // Draw photo/initials
        const photo = card.querySelector('.photo');
        if (photo) {
          if (photo instanceof HTMLImageElement && photo.src) {
            try {
              const photoX = x + (w - 76) / 2;
              const photoY = y + 8;
              ctx.beginPath();
              ctx.arc(photoX + 38, photoY + 38, 38, 0, Math.PI * 2);
              ctx.strokeStyle = '#9cc3c8';
              ctx.lineWidth = 3;
              ctx.stroke();
            } catch(e) {}
          } else {
            const initials = photo.textContent;
            ctx.fillStyle = '#2f6f78';
            ctx.font = 'bold 24px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(initials, x + w/2, y + 46);
          }
        }
        
        // Draw text
        const nameEl = card.querySelector('.name');
        const yearsEl = card.querySelector('.years');
        
        if (nameEl) {
          ctx.fillStyle = '#1d2b2f';
          ctx.font = 'bold 12px Arial';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'top';
          ctx.fillText(nameEl.textContent, x + w/2, y + 95);
        }
        
        if (yearsEl && yearsEl.textContent) {
          ctx.fillStyle = '#5d7176';
          ctx.font = '10px Arial';
          ctx.fillText(yearsEl.textContent, x + w/2, y + 115);
        }
      }
    });
    
    // Draw SVG lines
    const svgData = svg.outerHTML;
    const img = new Image();
    const svgString = new XMLSerializer().serializeToString(svg);
    const blob = new Blob([svgString], { type: 'image/svg+xml' });
    const url = URL.createObjectURL(blob);
    
    img.onload = function() {
      ctx.drawImage(img, 0, 0);
      URL.revokeObjectURL(url);
      
      // Download
      const link = document.createElement('a');
      link.href = canvas.toDataURL('image/png');
      link.download = 'Sangar-Family-Tree.png';
      link.click();
    };
    
    img.onerror = function() {
      URL.revokeObjectURL(url);
      // Fallback: download just the canvas
      const link = document.createElement('a');
      link.href = canvas.toDataURL('image/png');
      link.download = 'Sangar-Family-Tree.png';
      link.click();
    };
    
    img.src = url;
  }

  function toggleFullscreen() {
    const viewport = document.getElementById('viewport');
    
    if (!document.fullscreenElement) {
      viewport.requestFullscreen().catch(err => {
        alert('Fullscreen not available: ' + err.message);
      });
    } else {
      document.exitFullscreen();
    }
  }

  // Keyboard shortcuts
  document.addEventListener('keydown', (e) => {
    if (e.key === '+' || e.key === '=') { e.preventDefault(); zoomIn(); }
    if (e.key === '-') { e.preventDefault(); zoomOut(); }
    if (e.key === '0') { e.preventDefault(); fitToView(); }
  });

  // Mouse wheel zoom - directly without Ctrl key
  document.getElementById('viewport').addEventListener('wheel', (e) => {
    e.preventDefault();
    if (e.deltaY > 0) {
      zoomOut();
    } else {
      zoomIn();
    }
  }, { passive: false });

  // Initial fit
  setTimeout(() => {
    fitToView();
  }, 100);
</script>
</body>
</html>
